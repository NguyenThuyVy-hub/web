<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - WebForge Studio</title>
    <meta name="description" content="Đăng nhập vào hệ thống WebForge Studio.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF',
                        secondary: '#0F172A',
                        accent: '#3B82F6',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Gom gọn CSS tùy chỉnh vào thẻ style để đảm bảo code sạch sẽ */
        .input-effect {
            transition: all 0.3s ease;
        }
        .input-effect:hover, .input-effect:focus {
            border-color: #93C5FD; /* border-blue-300 */
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .btn-effect {
            transition: all 0.3s ease;
        }
        .btn-effect:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(30, 64, 175, 0.3);
        }
        
        .bg-glass {
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>

<body class="font-sans text-secondary bg-light antialiased selection:bg-accent selection:text-white min-h-screen flex flex-col">

    <!-- Header (Copy nguyên từ index.html) -->
    <header
        class="fixed w-full top-0 z-50 bg-white/70 backdrop-blur-md border-b border-gray-100 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-24">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center hover:-translate-y-1 transition-all duration-300">
                    <a href="index.html" class="text-3xl font-extrabold tracking-tighter">
                        WebForge<span class="text-accent">.</span>
                    </a>
                </div>

                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-10">
                    <a href="/services.html"
                        class="text-sm font-semibold text-gray-600 hover:text-accent transition-colors tracking-wide uppercase">Dịch
                        vụ</a>
                    <a href="portfolio.html"
                        class="text-sm font-semibold text-gray-600 hover:text-accent transition-colors tracking-wide uppercase">Portfolio</a>
                    <a href="contact.html"
                        class="text-sm font-semibold text-gray-600 hover:text-accent transition-colors tracking-wide uppercase">Liên
                        hệ</a>
                    <a href="blog.html"
                        class="text-sm font-semibold text-gray-600 hover:text-accent transition-colors tracking-wide uppercase">Blog
                    </a>
                </nav>

                <!-- CTA Button -->
                <div class="hidden md:flex items-center">
                    <a href="contact.html"
                        class="bg-gradient-to-r from-blue-700 to-blue-500 text-white px-7 py-3.5 rounded-full font-bold transition-all duration-300 shadow-[0_0_20px_rgba(59,130,246,0.5)] hover:shadow-[0_0_30px_rgba(59,130,246,0.7)] hover:-translate-y-1">
                        Nhận Báo Giá
                    </a>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden flex items-center">
                    <button class="text-gray-900 focus:outline-none p-2">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Login Section -->
    <main class="flex-grow flex items-center justify-center pt-32 md:pt-40 pb-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
        <!-- Abstract Decoration cho trang thêm phần nổi bật -->
        <div class="absolute top-1/4 left-1/4 w-[400px] h-[400px] bg-gradient-to-br from-blue-200 to-purple-100 rounded-full blur-[100px] opacity-40 -z-10 pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-gradient-to-tr from-blue-100 to-indigo-100 rounded-full blur-[120px] opacity-40 -z-10 pointer-events-none translate-x-1/2 translate-y-1/2"></div>

        <!-- Khối Glassmorphism Form Đăng nhập -->
        <div class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-2xl shadow-2xl shadow-blue-900/5 p-8 sm:p-10 border border-white relative z-10">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-secondary mb-2">Chào mừng trở lại</h1>
                <p class="text-gray-500 text-sm">Đăng nhập để tiếp tục truy cập vào WebForge Studio</p>
            </div>

            <form class="space-y-6" id="loginForm">
                <div>
                    <label for="email" class="block text-sm font-semibold text-secondary mb-2">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" required
                        class="input-effect transition-all duration-300 w-full px-5 py-4 bg-white/60 border border-gray-200 rounded-2xl text-secondary placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent"
                        placeholder="name@company.com">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-sm font-semibold text-secondary">Mật khẩu</label>
                        <a href="#" class="text-sm font-semibold text-primary hover:text-blue-800 transition-colors">Quên mật khẩu?</a>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="input-effect transition-all duration-300 w-full px-5 py-4 bg-white/60 border border-gray-200 rounded-2xl text-secondary placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent"
                        placeholder="••••••••">
                </div>

                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox"
                        class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded cursor-pointer transition-all">
                    <label for="remember_me" class="ml-2 block text-sm text-gray-600 cursor-pointer">
                        Ghi nhớ đăng nhập
                    </label>
                </div>

                <button type="submit"
                    class="btn-effect transition-all duration-300 w-full bg-primary text-white font-bold py-4 rounded-2xl shadow-md text-[15px] hover:-translate-y-1 hover:shadow-lg">
                    Đăng nhập vào hệ thống
                </button>
            </form>

            <div class="mt-8">
                <div class="relative flex items-center justify-center">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-200"></div>
                    </div>
                    <div class="relative bg-transparent px-4 text-sm text-gray-500 font-medium bg-white/70 backdrop-blur-sm rounded-full">
                        Hoặc đăng nhập với
                    </div>
                </div>

                <div class="mt-6">
                    <button type="button" id="googleLoginBtn"
                        class="btn-effect transition-all duration-300 w-full flex items-center justify-center gap-3 bg-white border border-gray-200 text-secondary font-bold py-4 rounded-2xl shadow-sm hover:bg-gray-50 text-[15px] hover:-translate-y-1">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Đăng nhập bằng Google
                    </button>
                </div>
            </div>

            <div class="mt-8 text-center text-sm">
                <span class="text-gray-600">Chưa có tài khoản?</span>
                <a href="#" class="font-bold text-primary hover:text-blue-800 transition-colors ml-1">Đăng ký ngay</a>
            </div>

        </div>
    </main>

    <!-- Cấu hình Firebase Authentication (Sẵn sàng kết nối) -->
    <script type="module">
        // Import các hàm cần thiết từ Firebase SDK v10.8
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB4FIqhBfY3mTPolBvcRP5Vzb-54zW_vcU",
            authDomain: "webforge-studio-611d7.firebaseapp.com",
            projectId: "webforge-studio-611d7",
            storageBucket: "webforge-studio-611d7.firebasestorage.app",
            messagingSenderId: "616575953826",
            appId: "1:616575953826:web:40a76bb16dd92f3ceb60fb",
            measurementId: "G-XRTNKR3EMD"
        };

        // Khởi tạo Firebase App và Auth
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Xử lý sự kiện Đăng nhập bằng Email/Password
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        console.log("Đăng nhập thành công!", userCredential.user);
                        // Điều hướng người dùng sau khi đăng nhập thành công
                        window.location.href = "dashboard.html";
                    })
                    .catch((error) => {
                        console.error("Lỗi đăng nhập:", error.message);
                        alert("Đăng nhập thất bại: Tài khoản hoặc mật khẩu không đúng.");
                    });
            });
        }

        // Xử lý sự kiện Đăng nhập bằng Google
        const googleBtn = document.getElementById('googleLoginBtn');
        if (googleBtn) {
            googleBtn.addEventListener('click', () => {
                signInWithPopup(auth, googleProvider)
                    .then((result) => {
                        console.log("Đăng nhập Google thành công!", result.user);
                        // Điều hướng sau khi đăng nhập Google thành công
                        window.location.href = "dashboard.html";
                    })
                    .catch((error) => {
                        console.error("Lỗi đăng nhập Google:", error.message);
                    });
            });
        }
    </script>
</body>
</html>
